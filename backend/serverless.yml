service: foody-serverless-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-2
  stage: prod
  timeout: 29
  memorySize: 512
  httpApi:
    cors:
      allowedOrigins:
        - https://main.d1wkttonpn0y1d.amplifyapp.com
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true

functions:
  api:
    handler: index.handler
    events:
      - httpApi:
          path: /
          method: '*'
      - httpApi:
          path: /{proxy+}
          method: '*'

package:
  patterns:
    - '!node_modules/.cache/**'
    - '!test-*.js'
    - '!check-*.js'
    - '!fix-*.js'
    - '!assign-delivery-boy.js'
    - '!delete-shop.js'
    - '!create-sample-usertypes.js'
